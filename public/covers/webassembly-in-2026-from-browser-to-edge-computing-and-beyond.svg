<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" style="background:#030712; font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,sans-serif;">
  <defs>
    <pattern id="grid-webassembly-in-2026-from-browser-to-edge-computing-and-beyond" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    </pattern>
    
    <radialGradient id="glow-webassembly-in-2026-from-browser-to-edge-computing-and-beyond" cx="20%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>
    
    <linearGradient id="card-grad-webassembly-in-2026-from-browser-to-edge-computing-and-beyond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(15, 23, 42, 0.85)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.45)"/>
    </linearGradient>

    <filter id="shadow-webassembly-in-2026-from-browser-to-edge-computing-and-beyond" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="630" fill="#030712"/>
  <rect width="1200" height="630" fill="url(#grid-webassembly-in-2026-from-browser-to-edge-computing-and-beyond)"/>
  <rect width="1200" height="630" fill="url(#glow-webassembly-in-2026-from-browser-to-edge-computing-and-beyond)"/>

  <!-- Outer Border Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="20" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5"/>

  <!-- Top Category HUD Badge -->
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="220" height="32" rx="16" fill="rgba(129, 140, 248, 0.15)" stroke="rgba(129, 140, 248, 0.3)" stroke-width="1"/>
    <circle cx="16" cy="16" r="4" fill="#818cf8"/>
    <text x="30" y="21" fill="#818cf8" font-size="11" font-weight="700" font-family="'JetBrains Mono',monospace" letter-spacing="1">DEVELOPER TOOLING</text>

    <rect x="235" y="0" width="140" height="32" rx="16" fill="rgba(255,255,255,0.04)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
    <text x="250" y="21" fill="#94a3b8" font-size="11" font-weight="600" font-family="'JetBrains Mono',monospace">WebAssembly</text>
  </g>

  <!-- Main Title Area -->
  <g transform="translate(60, 135)">
    <text x="0" y="0" fill="#ffffff" font-size="34" font-weight="800" letter-spacing="-0.5">
      WebAssembly in 2026: From Browser
    </text>
    <text x="0" y="42" fill="#ffffff" font-size="34" font-weight="800" letter-spacing="-0.5">to Edge Computing and Beyond</text>
    <text x="0" y="76" fill="#94a3b8" font-size="16" font-weight="400">
      coverImage: 
    </text>
  </g>

  <!-- Technical Artifact Panel -->
  <g transform="translate(60, 250)">
    <!-- LEFT: Code / Visual Window -->
    <g filter="url(#shadow-webassembly-in-2026-from-browser-to-edge-computing-and-beyond)">
      <rect x="0" y="0" width="520" height="280" rx="14" fill="url(#card-grad-webassembly-in-2026-from-browser-to-edge-computing-and-beyond)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
      <rect x="0" y="0" width="520" height="36" rx="14" fill="rgba(15, 23, 42, 0.9)"/>
      <path d="M 0 36 L 520 36" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
      
      <circle cx="20" cy="18" r="5" fill="#ef4444"/>
      <circle cx="36" cy="18" r="5" fill="#f59e0b"/>
      <circle cx="52" cy="18" r="5" fill="#10b981"/>
      <text x="75" y="22" fill="#64748b" font-size="11" font-family="'JetBrains Mono',monospace">Implementation Blueprint</text>

      <g transform="translate(20, 68)" font-family="'JetBrains Mono',monospace" font-size="11" fill="#e2e8f0" xml:space="preserve">
        <text y="0">use wasm_bindgen::prelude::*;</text>
<text y="22">#[wasm_bindgen]</text>
<text y="44">pub fn score_tokens(input: &amp;str) -&gt; u32 {</text>
<text y="66">    input</text>
<text y="88">        .split_whitespace()</text>
<text y="110">        .map(|token| token.len() as u32)</text>
<text y="132">        .sum()</text>

      </g>
    </g>

