<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" style="background:#07090e; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#141f36" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#07090e" stop-opacity="1"/>
    </radialGradient>

    <!-- Emerald Glow -->
    <filter id="glowEmerald" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Cyan Glow -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGlow)"/>
  <rect width="1200" height="630" fill="url(#gridPattern)"/>

  <!-- Top Ambient Glow Accents -->
  <circle cx="250" cy="90" r="150" fill="#00ff88" opacity="0.10" filter="blur(70px)"/>
  <circle cx="950" cy="110" r="160" fill="#00f0ff" opacity="0.10" filter="blur(70px)"/>

  <!-- Header Kicker Badges -->
  <g transform="translate(60, 48)">
    <rect x="0" y="0" width="300" height="32" rx="16" fill="rgba(0, 255, 136, 0.12)" stroke="rgba(0, 255, 136, 0.4)" stroke-width="1"/>
    <circle cx="16" cy="16" r="4" fill="#00ff88" filter="url(#glowEmerald)"/>
    <text x="30" y="21" fill="#00ff88" font-size="12" font-weight="700" letter-spacing="1.2">LOCAL AI REASONING • 2026</text>

    <!-- Sub-badge -->
    <rect x="315" y="0" width="220" height="32" rx="16" fill="rgba(0, 240, 255, 0.12)" stroke="rgba(0, 240, 255, 0.4)" stroke-width="1"/>
    <text x="330" y="21" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="1">100% OFFLINE • $0 API BILLS</text>
  </g>

  <!-- Main Headline -->
  <text x="60" y="126" fill="#ffffff" font-size="38" font-weight="800" letter-spacing="-0.5">
    Running DeepSeek-R1 Locally with Ollama:
  </text>
  <text x="60" y="172" fill="#00ff88" font-size="36" font-weight="800" letter-spacing="-0.5">
    The Zero-Dollar Setup That Shamed Cloud Subscriptions
  </text>
  <text x="60" y="206" fill="#94a3b8" font-size="16" font-weight="400">
    How pure reinforcement learning, local GGUF quantization, and Ollama give you private reasoning on any laptop.
  </text>

  <!-- Split Visual Architecture (Terminal Left, Hardware Tiers Right) -->
  <g transform="translate(60, 238)">
    <!-- Left Card: Terminal Mockup -->
    <g transform="translate(0, 0)">
      <rect width="530" height="325" rx="18" fill="rgba(10, 15, 26, 0.9)" stroke="rgba(0, 255, 136, 0.35)" stroke-width="1.5"/>
      <!-- Window Bar -->
      <path d="M 0 18 Q 0 0 18 0 L 512 0 Q 530 0 530 18 L 530 40 L 0 40 Z" fill="#111827"/>
      <circle cx="24" cy="20" r="5" fill="#ff5f56"/>
      <circle cx="42" cy="20" r="5" fill="#ffbd2e"/>
      <circle cx="60" cy="20" r="5" fill="#27c93f"/>
      <text x="82" y="24" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12">ollama run deepseek-r1:8b</text>

      <!-- Terminal Body -->
      <g transform="translate(24, 68)" font-family="'JetBrains Mono', monospace">
        <text x="0" y="0" fill="#38bdf8" font-size="14" font-weight="700">❯ ollama run deepseek-r1:8b</text>
        
        <!-- Think Box -->
        <rect x="0" y="16" width="482" height="150" rx="8" fill="rgba(0, 255, 136, 0.06)" stroke="rgba(0, 255, 136, 0.25)" stroke-width="1"/>
        <text x="16" y="42" fill="#00ff88" font-size="13" font-weight="700">&lt;think&gt;</text>
        <text x="16" y="68" fill="#a7f3d0" font-size="12">• Testing edge cases: array bounds &amp; null ptrs...</text>
        <text x="16" y="92" fill="#a7f3d0" font-size="12">• Backtracking: recursion depth exceeds stack</text>
        <text x="16" y="116" fill="#a7f3d0" font-size="12">• Switching to O(1) iterative two-pointer...</text>
        <text x="16" y="140" fill="#00ff88" font-size="13" font-weight="700">&lt;/think&gt;</text>

        <!-- Output Code -->
        <text x="0" y="196" fill="#ffffff" font-size="13">def two_sum(nums, target):</text>
        <text x="24" y="216" fill="#94a3b8" font-size="12"># Verified solution (0.34s • 36 tok/s)</text>
      </g>
    </g>

    <!-- Right Card: Hardware Matrix -->
    <g transform="translate(560, 0)">
      <rect width="520" height="325" rx="18" fill="rgba(10, 15, 26, 0.9)" stroke="rgba(0, 240, 255, 0.35)" stroke-width="1.5"/>
      <text x="28" y="36" fill="#38bdf8" font-size="16" font-weight="700">HARDWARE REALITY MATRIX</text>
      <text x="28" y="60" fill="#94a3b8" font-size="13">Which quantized tier fits your machine?</text>

      <!-- Tier 1: 1.5B -->
      <g transform="translate(28, 82)">
        <rect width="464" height="64" rx="10" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
        <text x="20" y="28" fill="#ffffff" font-size="15" font-weight="700">DeepSeek-R1-1.5B (Pocket)</text>
        <text x="20" y="48" fill="#94a3b8" font-size="12">Runs on any laptop • 2GB RAM</text>
        <text x="444" y="38" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="800" text-anchor="end">85 tok/s</text>
      </g>

      <!-- Tier 2: 8B Sweet Spot -->
      <g transform="translate(28, 158)">
        <rect width="464" height="68" rx="10" fill="rgba(0, 255, 136, 0.1)" stroke="rgba(0, 255, 136, 0.4)" stroke-width="1.5"/>
        <text x="20" y="28" fill="#00ff88" font-size="15" font-weight="700">DeepSeek-R1-8B (Sweet Spot) ⭐</text>
        <text x="20" y="50" fill="#a7f3d0" font-size="12">M1/M2/M3 Mac or RTX 3060+ • 8GB RAM</text>
        <text x="444" y="40" fill="#00ff88" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="800" text-anchor="end">35 tok/s</text>
      </g>

      <!-- Tier 3: 70B Heavyweight -->
      <g transform="translate(28, 238)">
        <rect width="464" height="64" rx="10" fill="rgba(255, 0, 85, 0.08)" stroke="rgba(255, 0, 85, 0.3)" stroke-width="1"/>
        <text x="20" y="28" fill="#fca5a5" font-size="15" font-weight="700">DeepSeek-R1-70B (Pro Station)</text>
        <text x="20" y="48" fill="#94a3b8" font-size="12">Requires 48GB+ unified memory</text>
        <text x="444" y="38" fill="#ff4d88" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="800" text-anchor="end">4 tok/s</text>
      </g>
    </g>
  </g>

  <!-- Footer Watermark / Signature -->
  <g transform="translate(60, 592)">
    <text x="0" y="16" fill="#64748b" font-size="13" font-weight="500">govindtank.is-a.dev • Frontier AI &amp; Local Systems</text>
    <text x="1080" y="16" fill="#64748b" font-size="13" font-weight="500" text-anchor="end">OLLAMA • GGUF • DEEPSEEK-R1</text>
  </g>
</svg>
