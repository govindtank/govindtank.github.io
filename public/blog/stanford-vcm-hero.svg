<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" style="background:#070b14; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#141f36" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#070b14" stop-opacity="1"/>
    </radialGradient>

    <!-- Cyan Glow -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Violet Glow -->
    <filter id="glowViolet" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGlow)"/>
  <rect width="1200" height="630" fill="url(#gridPattern)"/>

  <!-- Top Ambient Glow Accents -->
  <circle cx="200" cy="80" r="140" fill="#7c3aed" opacity="0.12" filter="blur(60px)"/>
  <circle cx="1000" cy="120" r="160" fill="#00f0ff" opacity="0.10" filter="blur(70px)"/>

  <!-- Kicker Pill & Badges -->
  <g transform="translate(60, 50)">
    <rect x="0" y="0" width="280" height="32" rx="16" fill="rgba(0, 240, 255, 0.12)" stroke="rgba(0, 240, 255, 0.4)" stroke-width="1"/>
    <circle cx="16" cy="16" r="4" fill="#00f0ff" filter="url(#glowCyan)"/>
    <text x="30" y="21" fill="#00f0ff" font-size="12" font-weight="700" letter-spacing="1.2">FRONTIER AI BREAKTHROUGH • 2026</text>

    <!-- Source Pill -->
    <rect x="295" y="0" width="220" height="32" rx="16" fill="rgba(124, 58, 237, 0.15)" stroke="rgba(124, 58, 237, 0.4)" stroke-width="1"/>
    <text x="312" y="21" fill="#c084fc" font-size="12" font-weight="700" letter-spacing="1">STANFORD &amp; EMNLP RESEARCH</text>
  </g>

  <!-- Main Headline -->
  <text x="60" y="132" fill="#ffffff" font-size="38" font-weight="800" letter-spacing="-0.5">
    Breaking the Likelihood Trap:
  </text>
  <text x="60" y="178" fill="#38bdf8" font-size="36" font-weight="800" letter-spacing="-0.5">
    Variance-Calibrated Modulation (VCM) for LLMs
  </text>
  <text x="60" y="212" fill="#94a3b8" font-size="16" font-weight="400">
    How pre-decoding logit reshaping eliminates repetitive degeneration and restores vocabulary richness without training.
  </text>

  <!-- 3-Column Visual Infographic Architecture -->
  <g transform="translate(60, 245)">
    <!-- Card 1: The Bottleneck (The Likelihood Trap) -->
    <g transform="translate(0, 0)">
      <rect width="340" height="310" rx="16" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(239, 68, 68, 0.3)" stroke-width="1.5"/>
      <!-- Header -->
      <rect x="20" y="20" width="8" height="24" rx="4" fill="#ef4444"/>
      <text x="36" y="38" fill="#fca5a5" font-size="15" font-weight="700">1. THE LIKELIHOOD TRAP</text>
      <text x="20" y="70" fill="#94a3b8" font-size="13">Standard Decoding Blindspots</text>

      <!-- Diagram: Degenerating Probability Curve -->
      <path d="M 30 150 Q 80 145 130 90 T 230 85 T 310 160" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2" stroke-dasharray="4 4"/>
      <path d="M 30 150 Q 70 80 120 75 Q 160 170 310 170" fill="none" stroke="#ef4444" stroke-width="2.5"/>

      <!-- Red Alert Badge -->
      <rect x="24" y="190" width="292" height="42" rx="8" fill="rgba(239, 68, 68, 0.12)" stroke="rgba(239, 68, 68, 0.3)" stroke-width="1"/>
      <text x="36" y="215" fill="#f87171" font-size="12" font-weight="600">⚠ Repetitive loops in long chains</text>
      
      <!-- Metric Detail -->
      <text x="24" y="260" fill="#cbd5e1" font-size="12" font-weight="500">• Fixed penalties distort semantic logits</text>
      <text x="24" y="284" fill="#cbd5e1" font-size="12" font-weight="500">• Tail truncation starves creative insight</text>
    </g>

    <!-- Card 2: The Core Mechanism (VCM Formulation) -->
    <g transform="translate(370, 0)">
      <rect width="340" height="310" rx="16" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(0, 240, 255, 0.35)" stroke-width="1.5"/>
      <!-- Header -->
      <rect x="20" y="20" width="8" height="24" rx="4" fill="#00f0ff"/>
      <text x="36" y="38" fill="#7dd3fc" font-size="15" font-weight="700">2. VCM FORMULATION</text>
      <text x="20" y="70" fill="#94a3b8" font-size="13">Scale-Invariant Pre-Decoding</text>

      <!-- Formula Pill Box -->
      <rect x="20" y="90" width="300" height="58" rx="10" fill="rgba(0, 240, 255, 0.08)" stroke="rgba(0, 240, 255, 0.25)" stroke-width="1"/>
      <text x="34" y="125" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700">
        M_t = Z_t - λ·Prior - γ·σ_t·Count
      </text>

      <!-- Breakdown 1: Contextual Searchlight -->
      <g transform="translate(24, 168)">
        <circle cx="10" cy="10" r="5" fill="#38bdf8"/>
        <text x="24" y="14" fill="#e2e8f0" font-size="12" font-weight="600">Contextual Searchlight (PMI)</text>
        <text x="24" y="32" fill="#94a3b8" font-size="11">Suppresses unconditional stopword priors</text>
      </g>

      <!-- Breakdown 2: Adaptive Variance -->
      <g transform="translate(24, 222)">
        <circle cx="10" cy="10" r="5" fill="#c084fc"/>
        <text x="24" y="14" fill="#e2e8f0" font-size="12" font-weight="600">Adaptive Self-Debiasing (σ_t)</text>
        <text x="24" y="32" fill="#94a3b8" font-size="11">Scales penalty by real-time logit variance</text>
      </g>

      <rect x="24" y="270" width="292" height="24" rx="6" fill="rgba(56, 189, 248, 0.1)"/>
      <text x="70" y="286" fill="#38bdf8" font-size="11" font-weight="700">TRAINING-FREE • ZERO WEIGHTS CHANGED</text>
    </g>

    <!-- Card 3: The Payoff (Benchmarks & Impact) -->
    <g transform="translate(740, 0)">
      <rect width="340" height="310" rx="16" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(52, 211, 153, 0.35)" stroke-width="1.5"/>
      <!-- Header -->
      <rect x="20" y="20" width="8" height="24" rx="4" fill="#10b981"/>
      <text x="36" y="38" fill="#6ee7b7" font-size="15" font-weight="700">3. MEASURABLE PAYOFF</text>
      <text x="20" y="70" fill="#94a3b8" font-size="13">Reasoning &amp; Diversity Gains</text>

      <!-- Big Metric 1 -->
      <g transform="translate(24, 96)">
        <text x="0" y="36" fill="#34d399" font-size="42" font-weight="900" letter-spacing="-1">+38.4%</text>
        <text x="170" y="22" fill="#f1f5f9" font-size="13" font-weight="700">Reasoning</text>
        <text x="170" y="38" fill="#94a3b8" font-size="11">Diversity Score</text>
      </g>

      <!-- Big Metric 2 -->
      <g transform="translate(24, 160)">
        <text x="0" y="36" fill="#00f0ff" font-size="42" font-weight="900" letter-spacing="-1">0.0 ms</text>
        <text x="170" y="22" fill="#f1f5f9" font-size="13" font-weight="700">Latency Hit</text>
        <text x="170" y="38" fill="#94a3b8" font-size="11">vLLM Logits Hook</text>
      </g>

      <!-- Production Checklist -->
      <g transform="translate(24, 230)">
        <rect x="0" y="0" width="292" height="58" rx="8" fill="rgba(16, 185, 129, 0.1)" stroke="rgba(16, 185, 129, 0.25)" stroke-width="1"/>
        <text x="14" y="24" fill="#a7f3d0" font-size="12" font-weight="700">✓ Drops into vLLM, llama.cpp &amp; Ollama</text>
        <text x="14" y="44" fill="#6ee7b7" font-size="11">• Eliminates repetitive multi-turn degradation</text>
      </g>
    </g>
  </g>

  <!-- Footer Watermark / Signature -->
  <g transform="translate(60, 585)">
    <text x="0" y="16" fill="#64748b" font-size="13" font-weight="500">govindtank.is-a.dev • Mobile Architecture &amp; Frontier AI Systems</text>
    <text x="1080" y="16" fill="#64748b" font-size="13" font-weight="500" text-anchor="end">arXiv:2606.22511</text>
  </g>
</svg>
