<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting...</title>
  <script>
    // Single Page Apps for GitHub Pages
    // https://github.com/rafgraph/spa-github-pages
    // MIT License
    // This script takes the current url and converts the path and query
    // into just a query string that is passed to the root index.html.
    // For example: https://user.github.io/repo/path?query=1
    // becomes: https://user.github.io/repo/?/path&query=1
    // Then in index.html, the path is read from the query string
    // and the router handles it as a normal route.

    var pathSegmentsToKeep = 0; // repo name for project pages, 0 for user/org pages

    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body>
  Redirecting...
</body>
</html>
