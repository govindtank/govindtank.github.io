<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>govindtank — interactive profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2128; --border:#30363d;
    --text:#e6edf3; --dim:#8b949e; --dim2:#6e7681;
    --green:#39d353; --green2:#7ee787; --cyan:#22d3ee; --pink:#f778ba; --purple:#d2a8ff; --blue:#79c0ff;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:'Space Grotesk',system-ui,sans-serif;min-height:100vh;padding:32px 16px 64px}
  .wrap{max-width:960px;margin:0 auto}

  /* terminal */
  .term{background:#0d1117;border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.55)}
  .term-bar{display:flex;align-items:center;gap:8px;padding:12px 16px;background:linear-gradient(#161b22,#10141c);border-bottom:1px solid var(--border)}
  .dot{width:12px;height:12px;border-radius:50%}
  .dot.r{background:#ff5f56}.dot.y{background:#ffbd2e}.dot.g{background:#27c93f}
  .term-title{margin-left:auto;margin-right:auto;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--dim2);transform:translateX(-24px)}
  .term-body{padding:20px 22px;min-height:430px;font-family:'JetBrains Mono',monospace;font-size:14px;line-height:1.75;overflow-x:auto}
  .line{white-space:pre-wrap;word-break:break-word}
  .p{color:var(--green);font-weight:600}
  .cmd{color:var(--text);font-weight:600}
  .dim{color:var(--dim)}
  .dim2{color:var(--dim2)}
  .ok{color:var(--green2)}
  .cy{color:var(--cyan)}
  .pk{color:var(--pink)}
  .pp{color:var(--purple)}
  .bl{color:var(--text);animation:blink 1s step-end infinite;font-weight:600}
  @keyframes blink{50%{opacity:0}}
  .name-big{font-size:26px;font-weight:700;letter-spacing:1px;background:linear-gradient(90deg,var(--cyan),var(--green2),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
  .prog{display:inline-block;vertical-align:middle}
  .prog .track{display:inline-block;width:300px;height:10px;border-radius:5px;background:#21262d;vertical-align:middle;overflow:hidden}
  .prog .fill{display:block;height:100%;width:0;border-radius:5px;background:linear-gradient(90deg,var(--green),var(--cyan));transition:width .18s ease}
  .spinner{display:inline-block;width:1em;color:var(--green);animation:spin .7s steps(4) infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .replay{margin-top:14px;font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:600;color:var(--cyan);background:none;border:1px solid var(--border);border-radius:8px;padding:8px 18px;cursor:pointer}
  .replay:hover{border-color:var(--cyan);background:rgba(34,211,238,.08)}

  /* section */
  h2{font-size:26px;font-weight:700;letter-spacing:.5px;margin:56px 0 8px;background:linear-gradient(90deg,var(--cyan),var(--green2),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{color:var(--dim);font-size:14px;margin-bottom:22px}

  /* cards */
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;overflow:hidden;cursor:pointer;transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease}
  .card:hover{transform:translateY(-4px);border-color:#3d444d;box-shadow:0 12px 40px rgba(0,0,0,.45)}
  .card .accent{height:5px}
  .card-inner{padding:18px 18px 16px}
  .card-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .card-name{font-size:17px;font-weight:600}
  .pill{font-size:11px;font-weight:700;color:#020617;padding:3px 10px;border-radius:99px}
  .card-code{margin-top:14px;background:#0d1117;border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--blue);white-space:pre;overflow-x:auto}
  .card-score{display:flex;align-items:center;gap:10px;margin-top:12px}
  .card-score .lbl{font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:600;color:var(--green2)}
  .card-score .bar{flex:1;height:6px;border-radius:3px;background:#21262d;overflow:hidden}
  .card-score .bar i{display:block;height:100%;width:0;border-radius:3px;transition:width 1s ease .3s}
  .card-tag{color:var(--dim);font-size:12.5px;margin-top:10px}
  .card-detail{max-height:0;overflow:hidden;transition:max-height .35s ease}
  .card.open .card-detail{max-height:320px}
  .card-detail-inner{padding:0 18px 18px}
  .card-detail p{color:var(--dim);font-size:13px;line-height:1.6;margin-bottom:10px}
  .lnk{display:inline-block;font-size:13px;font-weight:600;color:var(--cyan);text-decoration:none;border:1px solid var(--border);border-radius:8px;padding:7px 14px}
  .lnk:hover{border-color:var(--cyan);background:rgba(34,211,238,.08)}
  .foot{margin-top:56px;text-align:center;color:var(--dim2);font-size:13px}
  .foot a{color:var(--cyan);text-decoration:none}
  .bar-anim{animation:grow 1s ease forwards}
  @keyframes grow{to{width:100%}}
</style>
</head>
<body>
<div class="wrap">

  <div class="term">
    <div class="term-bar">
      <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
      <span class="term-title">govindtank@github — zsh</span>
    </div>
    <div class="term-body" id="termBody"></div>
  </div>
  <button class="replay" onclick="runTerminal()">↻ replay installation</button>

  <h2>THE ARSENAL</h2>
  <p class="sub">4 published packages · combined pana 640/640 · zero native deps · all in production — click a card</p>
  <div class="grid" id="grid"></div>

  <div class="foot">
    <a href="https://github.com/govindtank" target="_blank" rel="noopener">github.com/govindtank</a> ·
    <a href="https://pub.dev/publishers/pub.dartlang.org/author/govindtank" target="_blank" rel="noopener">pub.dev</a> ·
    <a href="https://govindtank.github.io/" target="_blank" rel="noopener">portfolio</a>
  </div>
</div>

<script>
const P = 'govindtank@github ~ % ';
const body = document.getElementById('termBody');

const LIB = [
  {name:'country_mobile_validator', ver:'v0.2.0', color:'#22d3ee', pill:'#22d3ee',
   code:'validateForCountry("IN","98765 43210")\nisMobileLength("IN", 10)   // true',
   tag:'zero native deps · libphonenumber metadata · mobile-only',
   detail:'Country-aware mobile number validation built on real libphonenumber data. No platform channels, no native code — pure Dart, works everywhere Flutter runs. Validates by country code, checks mobile-vs-landline, and enforces correct length per numbering plan.',
   url:'https://pub.dev/packages/country_mobile_validator'},
  {name:'flutter_whisper', ver:'v0.1.0', color:'#7ee787', pill:'#7ee787',
   code:'WhisperStream.start(audioBytes)\nstream.listen(onPartial, onCancel)',
   tag:'whisper.cpp bridge · offline STT · streaming + cancel',
   detail:'Streaming speech-to-text on-device via a whisper.cpp native bridge. Zero cloud cost, works offline, partial transcripts stream in real time, and long jobs can be cancelled mid-flight. Privacy stays on the device.',
   url:'https://pub.dev/packages/flutter_whisper'},
  {name:'waveform_pro', ver:'v1.0.0', color:'#f778ba', pill:'#f778ba',
   code:'WaveformView(painter: GpuPainter())\ncontroller.zoomTo(60fps, region)',
   tag:'GPU shader rasterizer · 60fps zoom · peak markers',
   detail:'Audio waveform rendering that stays at 60fps even on huge files — rasterization offloaded to the GPU via a fragment shader. Zoom into regions, drop peak markers, scrub through hours of audio without jank.',
   url:'https://pub.dev/packages/waveform_pro'},
  {name:'quote_painter', ver:'v0.1.0', color:'#d2a8ff', pill:'#d2a8ff',
   code:'QuoteCanvas.render("Code is poetry")\n..withGradient()..withShadow()',
   tag:'text-on-canvas engine · gradient · stroke · PNG export',
   detail:'A text-on-canvas engine for rendering quote images straight from Dart. Gradient fills, stroke, shadow, per-line alignment and PNG export — no widget tree, no ImageMagick, no server round-trip.',
   url:'https://pub.dev/packages/quote_painter'},
];

/* ---------- terminal ---------- */
const wait = ms => new Promise(r => setTimeout(r, ms));

async function typeText(el, text, speed=28){
  for(let i=0;i<text.length;i++){
    el.textContent = text.slice(0,i+1) + '\u2588';
    await wait(speed);
  }
  el.textContent = text;
}

function addLine(html, cls=''){ const d=document.createElement('div'); d.className='line '+cls; d.innerHTML=html; body.appendChild(d); return d; }

async function runTerminal(){
  body.innerHTML='';
  const t0=Date.now(), started=performance.now();
  const s = t=>started + t; // ms from start

  // cmd 1
  const l1=addLine('');
  l1.innerHTML='';
  await typeText(l1, P + 'curl -fsSL govindtank.dev/install | sh');
  await wait(250);

  addLine('<span class="dim">▸ installing govindtank-profile v2.1.0</span>');

  // spinner + progress
  const lp=addLine('<span class="spinner">⠋</span> <span class="dim">resolving dependencies</span> <span class="prog"><span class="track"><span class="fill" id="fill"></span></span></span> <span class="cy" id="pct">0%</span>');
  const fill=document.getElementById('fill'), pct=document.getElementById('pct');
  for(let p=0;p<=100;p+=5){ fill.style.width=p+'%'; pct.textContent=p+'%'; await wait(60); }
  lp.innerHTML='<span class="ok">✓</span> <span class="dim">dependencies resolved</span>';
  await wait(200);

  const ex=['<span class="ok">✓</span> <span class="dim">extracting skills — flutter · android · kotlin</span>',
            '<span class="ok">✓</span> <span class="dim">linking — python · on-device AI · data dashboards</span>',
            '<span class="ok">✓</span> <span class="dim">building — 50+ repos · 4 pub.dev packages · 2 Play Store apps</span>'];
  for(const e of ex){ addLine(e); await wait(260); }
  await wait(300);

  // cmd 2
  const l2=addLine('');
  await typeText(l2, P + 'govindtank --profile');
  await wait(280);
  addLine('<div class="name-big">GOVIND TANK</div>');
  await wait(120);
  addLine('<span class="cy">Mobile Architect · Developer · Technical Consultant</span>');
  await wait(120);
  addLine('<span class="dim">flutter · android · kotlin · python · on-device AI · automations</span>');
  await wait(300);

  // cmd 3
  const l3=addLine('');
  await typeText(l3, P + 'govindtank libs');
  await wait(280);
  for(const [i,lib] of LIB.entries()){
    addLine(`<span class="cmd">${lib.name}</span><span class="dim2">${' '.repeat(Math.max(2, 26-lib.name.length))}</span><span class="pp">${lib.ver}</span><span class="dim2">   </span><span class="ok">pana ${lib.color==='#7ee787'?'':'160/160'}</span>`);
    await wait(200);
  }
  // fix: score always 160/160
  body.lastChild.remove();
  for(const lib of LIB){ addLine(`<span class="cmd">${lib.name}</span><span class="dim2">${' '.repeat(Math.max(2, 26-lib.name.length))}</span><span class="pp">${lib.ver}</span><span class="dim2">  </span><span class="ok">160/160</span>`); await wait(200); }
  await wait(300);

  // cmd 4
  const l4=addLine('');
  await typeText(l4, P + 'govindtank whoami');
  await wait(280);
  addLine('<span class="pk">"automate the boring, ship the real, measure everything"</span>');
  await wait(300);

  addLine('<span class="ok">✓ install complete — govindtank-profile v2.1.0 is live</span>');
  addLine('');
  const last=addLine('');
  last.innerHTML='<span class="p">'+P.replace(/ /g,'&nbsp;')+'</span><span class="bl">█</span>';
}

/* ---------- cards ---------- */
const grid=document.getElementById('grid');
LIB.forEach((lib,i)=>{
  const c=document.createElement('div');
  c.className='card';
  c.innerHTML=`
    <div class="accent" style="background:linear-gradient(90deg,${lib.color},${lib.color}88)"></div>
    <div class="card-inner">
      <div class="card-top">
        <div class="card-name">${lib.name}</div>
        <span class="pill" style="background:${lib.pill}">${lib.ver}</span>
      </div>
      <div class="card-code">${lib.code}</div>
      <div class="card-score">
        <span class="lbl">pana 160/160</span>
        <span class="bar"><i style="background:${lib.color}"></i></span>
      </div>
      <div class="card-tag">${lib.tag}</div>
    </div>
    <div class="card-detail">
      <div class="card-detail-inner">
        <p>${lib.detail}</p>
        <a class="lnk" href="${lib.url}" target="_blank" rel="noopener">view on pub.dev ↗</a>
      </div>
    </div>`;
  c.addEventListener('click',()=>{
    c.classList.toggle('open');
    c.querySelector('.bar i').classList.add('bar-anim');
  });
  grid.appendChild(c);
});

/* animate score bars on scroll into view */
const io=new IntersectionObserver(es=>{
  es.forEach(e=>{ if(e.isIntersecting){ e.target.querySelector('.bar i').classList.add('bar-anim'); io.unobserve(e.target);} });
},{threshold:.4});
document.querySelectorAll('.card').forEach(c=>io.observe(c));

runTerminal();
</script>
</body>
</html>
